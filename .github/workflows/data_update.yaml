name: Update data

on:
  schedule:
    # Monday 08:00 CET (07:00 UTC)
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      ENTSOE_PAT: ${{ secrets.ENTSOE_PAT }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      JAO_TOKEN: ${{ secrets.JAO_TOKEN }}
      RUNNER_IMAGE_VERSION: ""  # populated at runtime by "Get runner image version" step

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'renv'  # pins R to the version recorded in renv.lock
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev \
            chromium-browser
          echo "CHROMOTE_CHROME=$(which chromium-browser)" >> "$GITHUB_ENV"

      - name: Get runner image version
        run: printf 'RUNNER_IMAGE_VERSION=%s\n' "${ImageVersion:-$(date +%Y-wk%U)}" >> "$GITHUB_ENV"

      - name: Cache R packages
        uses: actions/cache@v5
        with:
          path: ${{ env.R_LIBS_USER }}
          # RUNNER_IMAGE_VERSION ties the cache to the runner image, so
          # compiled .so files are never reused after a runner image update.
          key: r-packages-${{ runner.os }}-${{ env.RUNNER_IMAGE_VERSION }}-${{ hashFiles('renv.lock') }}
          restore-keys: |
            r-packages-${{ runner.os }}-${{ env.RUNNER_IMAGE_VERSION }}-
            r-packages-${{ runner.os }}-

      - name: Install R packages
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv")

          ok <- tryCatch({ renv::restore(); TRUE }, error = function(e) {
            message("renv::restore() failed: ", conditionMessage(e))
            FALSE
          })

          if (!ok) {
            message("Falling back to latest binary packages from RSPM")
            pkgs <- names(renv::lockfile_read()$Packages)
            install.packages(pkgs[!pkgs %in% rownames(installed.packages())])
          }
        shell: Rscript {0}

      # ── UA tasks ─────────────────────────────────────────────────────────

      - name: DAM UA (oree.com.ua)
        run: Rscript src/tasks/task_dam_ua.R
        continue-on-error: true

      - name: BM UA (ua.energy)
        run: Rscript src/tasks/task_bm_ua.R
        continue-on-error: true

      - name: Auction UA daily (ua.energy)
        run: Rscript src/tasks/task_auction_ua.R
        continue-on-error: true

      - name: Auction JAO (UA corridors)
        run: Rscript src/tasks/task_auction_jao.R
        continue-on-error: true

      - name: Solar UA (gpee.com.ua)
        run: Rscript src/tasks/task_solar_ua.R
        continue-on-error: true

      - name: Wind UA (gpee.com.ua)
        run: Rscript src/tasks/task_wind_ua.R
        continue-on-error: true

      # ── EU tasks (ENTSO-E Transparency) ─────────────────────────────────

      - name: EU gen + load + BM (ENTSO-E)
        run: Rscript src/tasks/task_eu.R
        continue-on-error: true

      - name: EU DAM prices hourly + 15min (ENTSO-E)
        run: Rscript src/tasks/task_dam_eu.R
        continue-on-error: true

      - name: EU transmission flows sched + phys (ENTSO-E)
        run: Rscript src/tasks/task_transm_eu.R
        continue-on-error: true

      # ── Market data (Yahoo Finance) ───────────────────────────────────

      - name: Market prices (TTF gas + EUA carbon)
        run: Rscript src/tasks/task_market_prices.R
        continue-on-error: true

      - name: UEEX gas (UA)
        run: Rscript src/tasks/task_ueex_gas.R
        continue-on-error: true

      # ── Transform ──────────────────────────────────────────────────────

      - name: Transform data
        run: Rscript src/tasks/task_transform.R
        continue-on-error: true

      # ── Commit ─────────────────────────────────────────────────────────

      - name: Commit and push updated data
        id: commit
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          git add data/data_raw/*.csv 2>/dev/null || true
          git add data/data_output/*.csv 2>/dev/null || true
          git add data/data_output/*.parquet 2>/dev/null || true

          if ! git diff --staged --quiet; then
            git commit -m "Auto-update data $(date +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger blog rebuild
        if: steps.commit.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          # Personal Access Token (classic) with repo scope on the blog repo.
          # Create at https://github.com/settings/tokens and store as
          # secret BLOG_DISPATCH_TOKEN in this (res-yield-data) repo.
          token: ${{ secrets.BLOG_DISPATCH_TOKEN }}
          repository: atsokol/energy-blog  # update if blog repo name differs
          event-type: data-updated